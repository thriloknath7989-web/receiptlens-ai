<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReceiptLens AI</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .main-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            font-size: 24px;
            color: #0f172a;
            margin-bottom: 8px;
        }
        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .upload-box {
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            padding: 20px;
            background: #f8fafc;
            margin-bottom: 20px;
        }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="main-card">
        <h1>ReceiptLens AI</h1>
        <p>Instant receipt parsing & tax audit for modern businesses.</p>
        
        <div class="upload-box">
            <span style="font-size: 14px; color: #475569; display:block; margin-bottom:10px;">Tap to select receipt image</span>
            <input type="file" id="receiptInput" accept="image/*">
        </div>

        <button class="btn" onclick="alert('Scanning feature ready!')">Scan Receipt Now</button>
    </div>
</body>
</html>
