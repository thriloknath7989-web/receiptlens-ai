<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReceiptLens AI - Smart Receipt Scanner</title>
    
    <meta name="theme-color" content="#0070f3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230070f3'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='50' fill='white'>🧾</text></svg>">

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 480px; margin: auto; background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .brand-header { text-align: center; margin-bottom: 20px; }
        .app-logo { font-size: 40px; margin-bottom: 5px; }
        h2 { margin: 5px 0; color: #111; font-size: 24px; }
        .tagline { font-size: 13px; color: #666; margin-bottom: 20px; }
        .upload-box { border: 2px dashed #0070f3; padding: 25px 15px; text-align: center; border-radius: 12px; margin: 20px 0; background: #f0f7ff; cursor: pointer; }
        input[type="file"] { width: 100%; margin-top: 10px; }
        button { background: #0070f3; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 600; box-shadow: 0 4px 12px rgba(0,112,243,0.3); }
        button:hover { background: #005bb5; }
        #result { margin-top: 20px; background: #111; color: #0f0; padding: 15px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; font-size: 12px; display: none; max-height: 300px; overflow-y: auto; }
        .loader { text-align: center; display: none; margin: 15px 0; color: #0070f3; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <div class="app-logo">🧾</div>
        <h2>ReceiptLens AI</h2>
        <div class="tagline">Instant receipt parsing & tax audit for modern businesses.</div>
    </div>

    <div class="upload-box">
        <label for="receiptInput" style="font-weight: 500; color: #0070f3;">Tap to select receipt image</label>
        <input type="file" id="receiptInput" accept="image/*">
    </div>

    <button onclick="handleScan()">Scan Receipt Now</button>
    
    <div id="loader" class="loader">AI is analyzing your document... Please wait.</div>
    <pre id="result"></pre>
</div>

<script>
const APP_TYPE = 'taxreceipt';
const BACKEND_URL = 'https://micro-saas-engine.thriloknath7989.workers.dev';

async function handleScan() {
    const fileInput = document.getElementById('receiptInput');
    const file = fileInput.files[0];
    const resultBox = document.getElementById('result');
    const loader = document.getElementById('loader');

    if (!file) {
        alert("Please select a receipt image first!");
        return;
    }

    loader.style.display = 'block';
    resultBox.style.display = 'none';

    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = async function () {
        const base64Image = reader.result;

        try {
            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    appType: APP_TYPE,
                    image: base64Image
                })
            });

            const data = await response.json();
            loader.style.display = 'none';

            if (!data.success) {
                throw new Error(data.error || "Server processing failed");
            }

            resultBox.style.display = 'block';
            resultBox.textContent = JSON.stringify(data.result, null, 2);

        } catch (err) {
            loader.style.display = 'none';
            alert("Scan failed: " + err.message);
        }
    };
}
</script>

</body>
</html>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
