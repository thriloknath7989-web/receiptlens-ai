<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReceiptLens AI</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    #install-banner {
      display: none;
      width: 100%;
      background: #1e40af;
      color: white;
      padding: 12px 16px;
      box-sizing: border-box;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    #install-btn {
      background: #ffffff;
      color: #1e40af;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .container {
      max-width: 400px;
      margin: 40px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      text-align: center;
    }
    .upload-area {
      border: 2px dashed #93c5fd;
      border-radius: 12px;
      padding: 30px 20px;
      margin: 20px 0;
      background: #eff6ff;
    }
    .btn-scan {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="install-banner">
    <span>Install ReceiptLens App on your device!</span>
    <button id="install-btn">Install App</button>
  </div>

  <div class="container">
    <h2>ReceiptLens AI</h2>
    <p>Instant receipt parsing & tax audit for modern businesses.</p>
    
    <div class="upload-area">
      <p>Tap to select receipt image</p>
      <input type="file" id="file-input" accept="image/*">
    </div>

    <button class="btn-scan">Scan Receipt Now</button>
  </div>

  <script>
    let deferredPrompt;
    const installBanner = document.getElementById('install-banner');
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBanner.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
